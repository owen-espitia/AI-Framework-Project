<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Frontpage</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <h1>Item Manager</h1>

    <section>
        <h2>Add a new item</h2>
        <form id="create-form">
            <label for="item-name">Name</label>
            <input id="item-name" name="name" type="text" required />

            <label for="item-price">Price</label>
            <input id="item-price" name="price" type="number" step="0.01" required />

            <label for="item-description">Description</label>
            <textarea id="item-description" name="description" rows="3" required></textarea>

            <button class="primary" type="submit">Create Item</button>
        </form>
        <div id="create-message" class="message"></div>
    </section>

    <section>
        <h2>All Items</h2>
        <div id="items-list"></div>
        <div id="items-empty" class="empty-state">Loading items...</div>
    </section>
    <!--Below script Designed by me, implemented by Microsoft Copilot on 04/15/26.-->
    <script>
        const itemsList = document.getElementById('items-list');
        const itemsEmpty = document.getElementById('items-empty');
        const createForm = document.getElementById('create-form');
        const createMessage = document.getElementById('create-message');

        async function fetchItems() {
            try {
                const response = await fetch('/items');
                if (!response.ok) {
                    throw new Error('Failed to load items');
                }
                const items = await response.json();
                renderItems(items);
            } catch (error) {
                itemsEmpty.textContent = 'Error loading items.';
                console.error(error);
            }
        }

        function renderItems(items) {
            itemsList.innerHTML = '';
            const itemEntries = Object.entries(items || {});

            if (itemEntries.length === 0) {
                itemsEmpty.textContent = 'No items yet. Add one using the form above.';
                return;
            }

            itemsEmpty.textContent = '';

            itemEntries.forEach(([id, item]) => {
                const card = document.createElement('div');
                card.className = 'item-card';

                const title = document.createElement('h3');
                title.textContent = `${item.name || 'Untitled'} (ID: ${id})`;
                card.appendChild(title);

                const price = document.createElement('p');
                price.innerHTML = `<strong>Price:</strong> $${Number(item.price).toFixed(2)}`;
                card.appendChild(price);

                const description = document.createElement('p');
                description.innerHTML = `<strong>Description:</strong> ${item.description || ''}`;
                card.appendChild(description);

                const actions = document.createElement('div');
                actions.className = 'item-actions';

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.className = 'danger';
                deleteButton.addEventListener('click', () => deleteItem(id));
                actions.appendChild(deleteButton);

                const editButton = document.createElement('button');
                editButton.textContent = 'Edit';
                editButton.className = 'secondary';
                editButton.addEventListener('click', () => showEditForm(id, item, card));
                actions.appendChild(editButton);

                card.appendChild(actions);
                itemsList.appendChild(card);
            });
        }

        async function createItem(data) {
            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to create item');
                }

                const result = await response.json();
                createMessage.textContent = `Created item ${result.name} (ID: ${result.id})`;
                createForm.reset();
                fetchItems();
            } catch (error) {
                createMessage.textContent = `Error: ${error.message}`;
                console.error(error);
            }
        }

        async function deleteItem(id) {
            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'DELETE',
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete item');
                }
                fetchItems();
            } catch (error) {
                console.error(error);
                alert(`Delete failed: ${error.message}`);
            }
        }

        function showEditForm(id, item, card) {
            const editForm = document.createElement('form');
            editForm.innerHTML = `
                <label>Name</label>
                <input name="name" value="${escapeHtml(item.name)}" required />
                <label>Price</label>
                <input name="price" type="number" step="0.01" value="${escapeHtml(item.price)}" required />
                <label>Description</label>
                <textarea name="description" rows="3" required>${escapeHtml(item.description)}</textarea>
            `;
            editForm.className = 'item-card';

            const saveButton = document.createElement('button');
            saveButton.type = 'submit';
            saveButton.className = 'primary';
            saveButton.textContent = 'Save Changes';

            const cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.className = 'secondary';
            cancelButton.textContent = 'Cancel';
            cancelButton.addEventListener('click', () => fetchItems());

            const buttonRow = document.createElement('div');
            buttonRow.className = 'item-actions';
            buttonRow.appendChild(saveButton);
            buttonRow.appendChild(cancelButton);
            editForm.appendChild(buttonRow);

            editForm.addEventListener('submit', event => {
                event.preventDefault();
                const formData = new FormData(editForm);
                const updatedItem = {
                    name: formData.get('name'),
                    price: Number(formData.get('price')),
                    description: formData.get('description'),
                };
                updateItem(id, updatedItem);
            });

            card.replaceWith(editForm);
        }

        async function updateItem(id, updatedItem) {
            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updatedItem),
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to update item');
                }
                fetchItems();
            } catch (error) {
                console.error(error);
                alert(`Update failed: ${error.message}`);
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        createForm.addEventListener('submit', event => {
            event.preventDefault();
            const form = event.target;
            const data = {
                name: form.name.value.trim(),
                price: Number(form.price.value),
                description: form.description.value.trim(),
            };
            createItem(data);
        });

        fetchItems();
    </script>
</body>
</html>
