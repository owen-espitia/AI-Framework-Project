<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Frontpage</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <h1>Item Manager</h1>

    <section>
        <h2>Add a new item</h2>
        <form id="create-form">
            <label for="item-name">Name</label>
            <input id="item-name" name="name" type="text" required />

            <label for="item-price">Price</label>
            <input id="item-price" name="price" type="number" step="0.01" required />

            <label for="item-description">Description</label>
            <textarea id="item-description" name="description" rows="3" required></textarea>

            <button class="primary" type="submit">Create Item</button>
        </form>
        <div id="create-message" class="message"></div>
    </section>

    <section>
        <h2>All Items</h2>
        <div id="items-list"></div>
        <div id="items-empty" class="empty-state">Loading items...</div>
    </section>
    <section>
        <h2>Chat with AI</h2>
        <div class="chat-container">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Type a message..." />
                <button id="chat-send">Send</button>
            </div>
        </div>
    </section>

    <section>
        <h2>AI Agent</h2>
        <div class="agent-container">
            <textarea id="agent-task" rows="3" placeholder="Describe a task, e.g. 'Find all items about keyboards. If there are none, create one.'"></textarea>
            <button id="agent-run" class="primary">Run Agent</button>

            <div id="agent-status" class="agent-status hidden">
                <span class="spinner"></span> Agent is working...
            </div>

            <div id="agent-trace" class="agent-trace hidden">
                <h3>Reasoning Trace</h3>
                <div id="agent-steps"></div>
            </div>

            <div id="agent-result" class="agent-result hidden">
                <h3>Result</h3>
                <p id="agent-result-text"></p>
            </div>
        </div>
    </section>

    <!-- Confirmation modal for destructive agent actions -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Confirm Agent Action</h3>
            <p>The agent wants to perform the following action. Approve to continue, or deny to cancel.</p>
            <div id="confirm-details"></div>
            <div class="modal-actions">
                <button id="confirm-approve" class="primary">Approve</button>
                <button id="confirm-deny" class="danger">Deny</button>
            </div>
        </div>
    </div>

    <section>
        <h2>Analyze Content</h2>
        <div class="analyze-container">
            <textarea id="analyze-input" placeholder="Paste or type content to analyze..." rows="5"></textarea>
            <button id="analyze-send" class="primary">Analyze</button>
            <div id="analyze-results" class="analyze-results"></div>
        </div>
    </section>

    <!--Below script Designed by me, implemented by Microsoft Copilot on 04/15/26.-->
    <script>
        const itemsList = document.getElementById('items-list');
        const itemsEmpty = document.getElementById('items-empty');
        const createForm = document.getElementById('create-form');
        const createMessage = document.getElementById('create-message');
        const predictForm = document.getElementById('predict-form');

        async function fetchItems() {
            try {
                const response = await fetch('/items');
                if (!response.ok) {
                    throw new Error('Failed to load items');
                }
                const items = await response.json();
                renderItems(items);
            } catch (error) {
                itemsEmpty.textContent = 'Error loading items.';
                console.error(error);
            }
        }

        function renderItems(items) {
            itemsList.innerHTML = '';

            if (!items || items.length === 0) {
                itemsEmpty.textContent = 'No items yet. Add one using the form above.';
                return;
            }

            itemsEmpty.textContent = '';

            items.forEach((item) => {
                const id = item._id || item.id; // MongoDB uses _id, but we'll use id in responses
                const card = document.createElement('div');
                card.className = 'item-card';

                const title = document.createElement('h3');
                title.textContent = `${item.name || 'Untitled'} (ID: ${id})`;
                card.appendChild(title);

                const price = document.createElement('p');
                price.innerHTML = `<strong>Price:</strong> $${Number(item.price).toFixed(2)}`;
                card.appendChild(price);

                const description = document.createElement('p');
                description.innerHTML = `<strong>Description:</strong> ${item.description || ''}`;
                card.appendChild(description);

                const actions = document.createElement('div');
                actions.className = 'item-actions';

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.className = 'danger';
                deleteButton.addEventListener('click', () => deleteItem(id));
                actions.appendChild(deleteButton);

                const editButton = document.createElement('button');
                editButton.textContent = 'Edit';
                editButton.className = 'secondary';
                editButton.addEventListener('click', () => showEditForm(id, item, card));
                actions.appendChild(editButton);

                card.appendChild(actions);
                itemsList.appendChild(card);
            });
        }

        async function createItem(data) {
            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to create item');
                }

                const result = await response.json();
                createMessage.textContent = `Created item ${result.name} (ID: ${result.id})`;
                createForm.reset();
                fetchItems();
            } catch (error) {
                createMessage.textContent = `Error: ${error.message}`;
                console.error(error);
            }
        }

        async function deleteItem(id) {
            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'DELETE',
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete item');
                }
                fetchItems();
            } catch (error) {
                console.error(error);
                alert(`Delete failed: ${error.message}`);
            }
        }

        function showEditForm(id, item, card) {
            const editForm = document.createElement('form');
            editForm.innerHTML = `
                <label>Name</label>
                <input name="name" value="${escapeHtml(item.name)}" required />
                <label>Price</label>
                <input name="price" type="number" step="0.01" value="${escapeHtml(item.price)}" required />
                <label>Description</label>
                <textarea name="description" rows="3" required>${escapeHtml(item.description)}</textarea>
            `;
            editForm.className = 'item-card';

            const saveButton = document.createElement('button');
            saveButton.type = 'submit';
            saveButton.className = 'primary';
            saveButton.textContent = 'Save Changes';

            const cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.className = 'secondary';
            cancelButton.textContent = 'Cancel';
            cancelButton.addEventListener('click', () => fetchItems());

            const buttonRow = document.createElement('div');
            buttonRow.className = 'item-actions';
            buttonRow.appendChild(saveButton);
            buttonRow.appendChild(cancelButton);
            editForm.appendChild(buttonRow);

            editForm.addEventListener('submit', event => {
                event.preventDefault();
                const formData = new FormData(editForm);
                const updatedItem = {
                    name: formData.get('name'),
                    price: Number(formData.get('price')),
                    description: formData.get('description'),
                };
                updateItem(id, updatedItem);
            });

            card.replaceWith(editForm);
        }

        async function updateItem(id, updatedItem) {
            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updatedItem),
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to update item');
                }
                fetchItems();
            } catch (error) {
                console.error(error);
                alert(`Update failed: ${error.message}`);
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Chat
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        let conversationHistory = [];

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        async function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            chatSend.disabled = true;
            appendMessage('user', text);
            const loadingDiv = appendMessage('bot', '...');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, conversation_history: conversationHistory }),
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Chat request failed');
                }
                const data = await response.json();
                loadingDiv.textContent = data.reply;
                conversationHistory = data.conversation_history;
            } catch (error) {
                loadingDiv.textContent = `Error: ${error.message}`;
                console.error(error);
            } finally {
                chatSend.disabled = false;
                chatInput.focus();
            }
        }

        chatSend.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') sendChatMessage();
        });

        createForm.addEventListener('submit', event => {
            event.preventDefault();
            const form = event.target;
            const data = {
                name: form.name.value.trim(),
                price: Number(form.price.value),
                description: form.description.value.trim(),
            };
            createItem(data);
        });

        // predictForm.addEventListener('submit', event => {
        //     event.preventDefault();
        //     const form = event.target;
        //     const data = {
        //         sepal_length: Number(form.sepal_length.value),
        //         sepal_width: Number(form.sepal_width.value),
        //         petal_length: Number(form.petal_length.value),
        //         petal_width: Number(form.petal_width.value),
        //     }
        //     fetch('/predict', {
        //         method: 'POST',
        //         headers: {
        //             'Content-Type': 'application/json',
        //         },
        //         body: JSON.stringify(data),
        //     })
        //     .then(response => {
        //         if (!response.ok) {
        //             return response.json().then(error => { throw new Error(error.detail || 'Prediction failed') });

        //         return response.json();

        //     .then(result => {
        //         console.log('front-end recieved prediction result:', result);
        //         alert(`Predicted species: ${result.species}\nConfidence: ${(result.confidence * 100).toFixed(2)}%`);
        //         form.reset();
        //     })
        //     .catch(error => {
        //         console.error(error);
        //         alert(`Prediction error: ${error.message}`);
        //     });
        // });
        
        // Analyze content functionality
        const analyzeInput = document.getElementById('analyze-input');
        const analyzeSend = document.getElementById('analyze-send');
        const analyzeResults = document.getElementById('analyze-results');

        function displayAnalysisResults(data) {
            analyzeResults.innerHTML = `
                <h3>Analysis Results</h3>
                <div class="result-section">
                    <div class="result-label">Sentiment</div>
                    <div class="sentiment ${data.sentiment}">${data.sentiment.toUpperCase()}</div>
                </div>
                <div class="result-section">
                    <div class="result-label">Categories</div>
                    <div class="categories-container">
                        ${data.categories.map(cat => `<span class="category">${cat}</span>`).join('')}
                    </div>
                </div>
                <div class="result-section">
                    <div class="result-label">Tags</div>
                    <div class="tags-container">
                        ${data.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
                <div class="result-section">
                    <div class="result-label">Summary</div>
                    <div class="summary-text">${data.summary}</div>
                </div>
            `;
            analyzeResults.classList.add('active');
        }

        async function sendAnalysis() {
            const text = analyzeInput.value.trim();
            if (!text) return;

            analyzeSend.disabled = true;
            analyzeResults.innerHTML = '<div class="loading">Analyzing content...</div>';
            analyzeResults.classList.add('active');

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text }),
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Analysis request failed');
                }
                const data = await response.json();
                displayAnalysisResults(data);
            } catch (error) {
                analyzeResults.innerHTML = `<div class="loading" style="color: red;">Error: ${error.message}</div>`;
                console.error(error);
            } finally {
                analyzeSend.disabled = false;
            }
        }

        analyzeSend.addEventListener('click', sendAnalysis);
        analyzeInput.addEventListener('keydown', event => {
            if (event.key === 'Enter' && event.ctrlKey) {
                sendAnalysis();
            }
        });

        fetchItems();

        // ── Agent ──────────────────────────────────────────────────────────────
        const agentTask       = document.getElementById('agent-task');
        const agentRunBtn     = document.getElementById('agent-run');
        const agentStatus     = document.getElementById('agent-status');
        const agentTrace      = document.getElementById('agent-trace');
        const agentStepsEl    = document.getElementById('agent-steps');
        const agentResult     = document.getElementById('agent-result');
        const agentResultText = document.getElementById('agent-result-text');
        const confirmModal    = document.getElementById('confirm-modal');
        const confirmDetails  = document.getElementById('confirm-details');
        const confirmApprove  = document.getElementById('confirm-approve');
        const confirmDeny     = document.getElementById('confirm-deny');

        function appendStep(step) {
            const div = document.createElement('div');
            div.className = 'agent-step';
            div.innerHTML = `
                <div class="step-header">
                    <span class="step-tool-name">${escapeHtml(step.tool)}</span>
                </div>
                <div class="step-body">
                    <div class="step-row">
                        <strong>Input:</strong>
                        <code>${escapeHtml(JSON.stringify(step.input, null, 2))}</code>
                    </div>
                    <div class="step-row">
                        <strong>Output:</strong>
                        <span class="step-output-text">${escapeHtml(step.output)}</span>
                    </div>
                </div>`;
            agentStepsEl.appendChild(div);
            agentTrace.classList.remove('hidden');
        }

        async function runAgent(autoConfirmCreate) {
            const task = agentTask.value.trim();
            if (!task) return;

            agentRunBtn.disabled = true;
            agentStatus.classList.remove('hidden');
            agentStepsEl.innerHTML = '';
            agentTrace.classList.add('hidden');
            agentResult.classList.add('hidden');

            // Isolate network errors in their own try/catch so that the modal
            // path below can never be silently swallowed by the catch handler.
            let data;
            try {
                const resp = await fetch('/agent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task, auto_confirm_create: autoConfirmCreate})
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'Agent request failed');
                }
                data = await resp.json();
            } catch (err) {
                agentResult.classList.remove('hidden');
                agentResultText.textContent = 'Error: ' + err.message;
                agentRunBtn.disabled = false;
                agentStatus.classList.add('hidden');
                return;
            }

            // Response processing happens outside try/catch from here on.
            agentRunBtn.disabled = false;
            agentStatus.classList.add('hidden');

            (data.steps || []).forEach(appendStep);

            if (data.status === 'needs_confirmation') {
                if (data.pending_action) {
                    showConfirmModal(data.pending_action);
                } else {
                    agentResult.classList.remove('hidden');
                    agentResultText.textContent = 'Agent needs confirmation but returned no action details. Please try again.';
                }
                return;
            }

            agentResult.classList.remove('hidden');
            agentResultText.textContent = data.status === 'max_steps_reached'
                ? '⚠️ ' + data.result
                : data.result;

            if ((data.steps || []).some(s => s.tool === 'create_item')) {
                fetchItems();
            }
        }

        function showConfirmModal(pendingAction) {
            confirmDetails.innerHTML = `
                <p><strong>Tool:</strong> <code>${escapeHtml(pendingAction.tool)}</code></p>
                <pre class="confirm-args">${escapeHtml(JSON.stringify(pendingAction.args, null, 2))}</pre>`;
            confirmModal.classList.remove('hidden');

            confirmApprove.onclick = () => {
                confirmModal.classList.add('hidden');
                runAgent(true);
            };

            confirmDeny.onclick = () => {
                confirmModal.classList.add('hidden');
                agentResult.classList.remove('hidden');
                agentResultText.textContent = 'Action denied by user. Task cancelled.';
            };
        }

        agentRunBtn.addEventListener('click', () => runAgent(false));
        agentTask.addEventListener('keydown', e => {
            if (e.key === 'Enter' && e.ctrlKey) runAgent(false);
        });
    </script>
